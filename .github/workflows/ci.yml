name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@1e60f2f8ed53801c78d5d0e1ad1cf3f97e573cc9 # v4.0.2
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --run

      - name: Build production bundle
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@fa0a91b85d4a6f829c5f832508c07d968ceca214 # v4.3.6
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  cpp:
    name: C++ Build & Tests
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup build cache
        uses: actions/cache@3624ceb22c1c5a301c8db4169662070a689d9ea8 # v4.0.2
        with:
          path: build
          key: ${{ runner.os }}-cpp-${{ hashFiles('CMakeLists.txt', 'src/**/*.cpp', 'include/**/*.h') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure project
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Package build artifacts
        run: |
          tar -czf cpp-build.tar.gz -C build .

      - name: Upload C++ build artifacts
        uses: actions/upload-artifact@fa0a91b85d4a6f829c5f832508c07d968ceca214 # v4.3.6
        with:
          name: cpp-build
          path: cpp-build.tar.gz
          if-no-files-found: error
